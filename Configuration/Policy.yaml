privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'Medienreaktor.NeosStudio:Module':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\StudioController->indexAction()) || method(Medienreaktor\NeosStudio\Controller\StudioModuleController->indexAction())'
    # The preview iframe renders arbitrary workspaces/dimensions; what the
    # user may actually see is enforced by the CR's structural authorization
    # inside the subgraph, this target only gates the endpoint as such.
    'Medienreaktor.NeosStudio:Preview':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\PreviewController->showAction())'

    # The anonymous consumption endpoint for preview links: granted to
    # Everybody (below) following the core's Neos.Neos:PublicFrontendAccess
    # pattern - the core's AllControllerActions catch-all matches every
    # controller action, so without an explicit Everybody GRANT an anonymous
    # request is forced to authenticate (401). The actual credential is the
    # token in the URL, validated in-action.
    'Medienreaktor.NeosStudio:PublicShareAccess':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\ShareController->showAction())'

    # The realtime sidecar's server-to-server feed-head endpoint: Everybody-
    # granted for the same reason as the share endpoint above. The actual
    # credential is the shared secret in the X-Realtime-Secret header,
    # validated in-action - and while no secret is configured the action
    # answers 404 outright.
    'Medienreaktor.NeosStudio:RealtimeFeed':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\RealtimeController->headAction())'

  # The Studio API (Neos.OpenApi.FlowAdapter.apis.studio): as for Neos.Api,
  # each target is a capability AND the OAuth scope a token needs to use it -
  # the matcher is the scope (a constant in Security\StudioScopes), the label
  # its description on the consent page. Neos.Api's PrivilegeScopes
  # contributes them to Neos.OAuth; its ApiAuthContextProvider checks both,
  # the token's scopes and the account's privileges, before an operation runs.
  # Workspace-level rules (who may manage a task, read a workspace's history)
  # are checked by the operations on top.
  'Neos\Api\Security\ApiPrivilege':
    'Medienreaktor.NeosStudio:Api.Notifications.Read':
      matcher: 'studio.notifications.read'
      label: 'Read your Neos Studio notifications'
    'Medienreaktor.NeosStudio:Api.Notifications.Update':
      matcher: 'studio.notifications.update'
      label: 'Mark your Neos Studio notifications read and clear them'

    'Medienreaktor.NeosStudio:Api.PreviewLinks.Read':
      matcher: 'studio.previewlinks.read'
      label: 'List your preview links'
    # Minting additionally requires read access on the target workspace
    # (checked by the operation), so a link never grants more than its
    # creator could see.
    'Medienreaktor.NeosStudio:Api.PreviewLinks.Create':
      matcher: 'studio.previewlinks.create'
      label: 'Create preview links that show a page to anybody with the link'
    'Medienreaktor.NeosStudio:Api.PreviewLinks.Delete':
      matcher: 'studio.previewlinks.delete'
      label: 'Revoke your preview links'

    # Filtered to the task workspaces the account may read.
    'Medienreaktor.NeosStudio:Api.Tasks.Read':
      matcher: 'studio.tasks.read'
      label: 'Read the tasks and their comments'
    # Create tasks and drive the workflow (update, assign, submit, reopen,
    # delete, comment) - per task as the account's workspace roles allow.
    'Medienreaktor.NeosStudio:Api.Tasks.Update':
      matcher: 'studio.tasks.update'
      label: 'Create, change, assign, submit, reopen, delete and comment on tasks'
    # Mark a task done. Does not publish itself - publishing rights are
    # enforced by the content repository on Neos.Api's publish operation.
    'Medienreaktor.NeosStudio:Api.Tasks.Approve':
      matcher: 'studio.tasks.approve'
      label: 'Approve tasks'

    # The caller's OWN effective access: which sites, branches, dimensions and
    # workspaces their access roles leave open. Strictly self-describing, so
    # every editor gets it; the Studio needs it to shape its UI.
    'Medienreaktor.NeosStudio:Api.Access.Read':
      matcher: 'studio.access.read'
      label: 'Read where your access roles let you work'
    # Reading the role catalogue: who may go where. Administrators only,
    # matching the classic Users module.
    'Medienreaktor.NeosStudio:Api.AccessRoles.Read':
      matcher: 'studio.accessroles.read'
      label: 'Read the access roles and their members'
    # Creating, editing and deleting roles, and assigning members.
    'Medienreaktor.NeosStudio:Api.AccessRoles.Update':
      matcher: 'studio.accessroles.update'
      label: 'Create, change and delete access roles and assign their members'

  'Neos\Neos\Security\Authorization\Privilege\ModulePrivilege':
    # Controls both visibility of the "Neos Studio" entry in the backend menu
    # and access to /neos/module/studio. Matcher must equal the module path.
    'Medienreaktor.NeosStudio:Backend.Module.Studio':
      matcher: 'studio'

roles:
  # Anonymous visitors may reach the share endpoint; the preview-link token
  # in the URL is the credential (validated in-action, 404 otherwise).
  'Neos.Flow:Everybody':
    privileges:
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:PublicShareAccess'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:RealtimeFeed'
        permission: GRANT

  # Any backend editor may open the Studio; what they can actually do inside
  # is governed by the API's own policies and the OAuth token scopes.
  'Neos.Neos:AbstractEditor':
    privileges:
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Module'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Backend.Module.Studio'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Preview'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Notifications.Read'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Notifications.Update'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.PreviewLinks.Read'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.PreviewLinks.Create'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.PreviewLinks.Delete'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Tasks.Read'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Tasks.Update'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Access.Read'
        permission: GRANT
      # Neos.Api grants these to Neos.Neos:Editor only, but the shell cannot
      # boot without the node types and dimensions - a restricted editor who
      # may open the Studio needs them as well.
      -
        privilegeTarget: 'Neos.Api:ContentRepositories.Read'
        permission: GRANT
      -
        privilegeTarget: 'Neos.Api:NodeTypes.Read'
        permission: GRANT
      # Neos.Api grants reading users to user managers only; the Studio names
      # users everywhere editors work together (task assignees, workspace
      # owners and members), so every editor may list them. Changing users
      # stays with user managers.
      -
        privilegeTarget: 'Neos.Api:Users.Read'
        permission: GRANT

  # Access roles decide where the editorial team may work - granting and
  # revoking that is administration, like user management.
  'Neos.Neos:Administrator':
    privileges:
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.AccessRoles.Read'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.AccessRoles.Update'
        permission: GRANT

  'Neos.Neos:LivePublisher':
    privileges:
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Tasks.Approve'
        permission: GRANT
