privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'Medienreaktor.NeosStudio:Module':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\StudioController->indexAction()) || method(Medienreaktor\NeosStudio\Controller\StudioModuleController->indexAction())'
    # The preview iframe renders arbitrary workspaces/dimensions; what the
    # user may actually see is enforced by the CR's structural authorization
    # inside the subgraph, this target only gates the endpoint as such.
    'Medienreaktor.NeosStudio:Preview':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\PreviewController->showAction())'

    # The authenticated user's own notifications (list + mark read). Strictly
    # per-user - the controller resolves the recipient from the account, so
    # granting this to all editors exposes nothing across users.
    'Medienreaktor.NeosStudio:Api.Notifications':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\Api\NotificationsController->.*Action())'

    # Mint, list and revoke the authenticated user's own shareable preview
    # links. Strictly per-user like the notifications; additionally, minting
    # requires read access on the target workspace (checked in-action), so a
    # link can never grant more than its creator could see.
    'Medienreaktor.NeosStudio:Api.PreviewLinks':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\Api\PreviewLinksController->(index|create|delete)Action())'

    # The anonymous consumption endpoint for preview links: granted to
    # Everybody (below) following the core's Neos.Neos:PublicFrontendAccess
    # pattern - the core's AllControllerActions catch-all matches every
    # controller action, so without an explicit Everybody GRANT an anonymous
    # request is forced to authenticate (401). The actual credential is the
    # token in the URL, validated in-action.
    'Medienreaktor.NeosStudio:PublicShareAccess':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\ShareController->showAction())'

    # --- Task workflow -------------------------------------------------------
    # Workspace-level authorization is NOT handled by these targets: the
    # controller checks the acting user's per-workspace permissions (creator
    # and reviewers manage, the assignee writes), and the content repository
    # enforces publish rights structurally.

    # Read the task list (filtered to workspaces the account may read) and a
    # task's comment thread (read access on the workspace checked in-action).
    'Medienreaktor.NeosStudio:Api.Tasks.Read':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\Api\TasksController->(index|comments)Action())'

    # Create tasks and drive the workflow (update, assign, submit, reopen,
    # delete, comment).
    'Medienreaktor.NeosStudio:Api.Tasks.Write':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\Api\TasksController->(create|update|assign|submit|reopen|delete|addComment)Action())'

    # Approve a task: mark it done after its changes were published through
    # the review flow. Does not publish itself - publishing rights are
    # enforced by the content repository on the publish endpoints.
    'Medienreaktor.NeosStudio:Api.Tasks.Approve':
      matcher: 'method(Medienreaktor\NeosStudio\Controller\Api\TasksController->approveAction())'

  'Neos\Neos\Security\Authorization\Privilege\ModulePrivilege':
    # Controls both visibility of the "Neos Studio" entry in the backend menu
    # and access to /neos/module/studio. Matcher must equal the module path.
    'Medienreaktor.NeosStudio:Backend.Module.Studio':
      matcher: 'studio'

roles:
  # Anonymous visitors may reach the share endpoint; the preview-link token
  # in the URL is the credential (validated in-action, 404 otherwise).
  'Neos.Flow:Everybody':
    privileges:
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:PublicShareAccess'
        permission: GRANT

  # Any backend editor may open the Studio; what they can actually do inside
  # is governed by the API's own policies and the OAuth token scopes.
  'Neos.Neos:AbstractEditor':
    privileges:
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Module'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Backend.Module.Studio'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Preview'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Notifications'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.PreviewLinks'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Tasks.Read'
        permission: GRANT
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Tasks.Write'
        permission: GRANT

  'Neos.Neos:LivePublisher':
    privileges:
      -
        privilegeTarget: 'Medienreaktor.NeosStudio:Api.Tasks.Approve'
        permission: GRANT
