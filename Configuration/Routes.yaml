#
# The Studio API has no routes of its own: its operations are part of
# Neos.Api's neos/openapi API below /api (Neos.OpenApi.FlowAdapter.apis.neos
# in Settings.yaml), whose routes the FlowAdapter registers.
#

-
  # Server-to-server: the realtime sidecar (Resources/Private/Realtime/server.js) watches
  # the head of workspace change feeds here, authenticated by the
  # X-Realtime-Secret header (see RealtimeController). Sessionless like the
  # share endpoint.
  name: 'Studio: realtime sidecar feed head'
  uriPattern: 'neos/studio/realtime/cr/{contentRepositoryId}/workspaces/{workspaceName}/head'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Realtime'
    '@action': 'head'
    '@format': 'json'
  httpMethods: ['GET']

-
  # Public by design: the token in the path is the sole credential (see
  # ShareController). Sessionless, no privilege target.
  name: 'Studio: shared preview link (anonymous)'
  uriPattern: 'neos/studio/share/{token}'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Share'
    '@action': 'show'
    '@format': 'html'
  httpMethods: ['GET']

-
  name: 'Studio: document preview (iframe)'
  uriPattern: 'neos/studio/preview'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Preview'
    '@action': 'show'
    '@format': 'html'
  # The node (contentRepositoryId, workspaceName, dimensionSpacePoint as
  # JSON, nodeAggregateId) and mode (rendering mode name) travel as query
  # parameters.
  appendExceedingArguments: true
  httpMethods: ['GET']

-
  name: 'Studio: OAuth callback / SPA entry'
  uriPattern: 'neos/studio'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Studio'
    '@action': 'index'
    '@format': 'html'
  # The SPA returns from the OAuth flow with ?code=&state= as query string;
  # allow them as exceeding arguments so the intercepted-request resume after
  # login can reverse-route this URL.
  appendExceedingArguments: true
  httpMethods: ['GET']
