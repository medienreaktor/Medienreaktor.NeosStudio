# --- Workspace review, history and trash read models -------------------------
# Writing (publish, discard, rebase, restore) is Neos.Api's. pending-events/diff
# comes before pending-events - a longer, more specific pattern must win.
-
  name: 'Studio API: workspace document changes (review)'
  uriPattern: 'neos/studio/api/workspaces/{workspaceName}/document-changes'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\WorkspaceHistory'
    '@action': 'documentChanges'
    '@format': 'json'
  httpMethods: ['GET']

-
  name: 'Studio API: workspace document diff'
  uriPattern: 'neos/studio/api/workspaces/{workspaceName}/document-diff'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\WorkspaceHistory'
    '@action': 'documentDiff'
    '@format': 'json'
  httpMethods: ['GET']
  appendExceedingArguments: true

-
  name: 'Studio API: workspace pending events diff'
  uriPattern: 'neos/studio/api/workspaces/{workspaceName}/pending-events/diff'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\WorkspaceHistory'
    '@action': 'pendingEventsDiff'
    '@format': 'json'
  httpMethods: ['GET']
  appendExceedingArguments: true

-
  name: 'Studio API: workspace pending events (history)'
  uriPattern: 'neos/studio/api/workspaces/{workspaceName}/pending-events'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\WorkspaceHistory'
    '@action': 'pendingEvents'
    '@format': 'json'
  httpMethods: ['GET']

-
  name: 'Studio API: workspace trash'
  uriPattern: 'neos/studio/api/workspaces/{workspaceName}/trash'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\WorkspaceHistory'
    '@action': 'trash'
    '@format': 'json'
  httpMethods: ['GET']
  appendExceedingArguments: true

-
  name: 'Studio API: workspace conflict details'
  uriPattern: 'neos/studio/api/workspaces/{workspaceName}/conflict-details'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\WorkspaceHistory'
    '@action': 'conflictDetails'
    '@format': 'json'
  httpMethods: ['GET']
  appendExceedingArguments: true

-
  # Server-to-server: the realtime sidecar (Resources/Private/Realtime/server.js) tails
  # workspace change feeds here, authenticated by the X-Realtime-Secret
  # header (see RealtimeController). Sessionless like the share endpoint.
  name: 'Studio: realtime sidecar event feed'
  uriPattern: 'neos/studio/api/realtime/workspaces/{workspaceName}/events'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Realtime'
    '@action': 'events'
    '@format': 'json'
  httpMethods: ['GET']

-
  # Public by design: the token in the path is the sole credential (see
  # ShareController). Sessionless, no privilege target.
  name: 'Studio: shared preview link (anonymous)'
  uriPattern: 'neos/studio/share/{token}'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Share'
    '@action': 'show'
    '@format': 'html'
  httpMethods: ['GET']

-
  name: 'Studio: document preview (iframe)'
  uriPattern: 'neos/studio/preview'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Preview'
    '@action': 'show'
    '@format': 'html'
  # node (base64url NodeAddress: workspace + dimension + aggregate id) and
  # mode (rendering mode name) travel as query parameters.
  appendExceedingArguments: true
  httpMethods: ['GET']

-
  name: 'Studio: OAuth callback / SPA entry'
  uriPattern: 'neos/studio'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Studio'
    '@action': 'index'
    '@format': 'html'
  # The SPA returns from the OAuth flow with ?code=&state= as query string;
  # allow them as exceeding arguments so the intercepted-request resume after
  # login can reverse-route this URL.
  appendExceedingArguments: true
  httpMethods: ['GET']
