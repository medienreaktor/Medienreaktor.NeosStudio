#
# Studio shell API below neos/studio/api (OAuth bearer secured via Neos.OAuth:Bearer,
# see Settings.yaml) - kept out of Neos.Api's /api namespace on purpose
#

# --- Access roles --------------------------------------------------------
# The caller's OWN effective access comes first: every editor may read it,
# while everything below is administration.
-
  name: 'Studio API: own effective access'
  uriPattern: 'neos/studio/api/access/me'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\AccessRoles'
    '@action': 'me'
    '@format': 'json'
  httpMethods: ['GET']

-
  name: 'Studio API: access roles list'
  uriPattern: 'neos/studio/api/access/roles'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\AccessRoles'
    '@action': 'index'
    '@format': 'json'
  httpMethods: ['GET']

-
  name: 'Studio API: create access role'
  uriPattern: 'neos/studio/api/access/roles'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\AccessRoles'
    '@action': 'create'
    '@format': 'json'
  httpMethods: ['POST']

# Before the {roleId} routes below - a longer, more specific pattern must win.
-
  name: 'Studio API: set access role members'
  uriPattern: 'neos/studio/api/access/roles/{roleId}/members'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\AccessRoles'
    '@action': 'setMembers'
    '@format': 'json'
  httpMethods: ['PUT']

-
  name: 'Studio API: update access role'
  uriPattern: 'neos/studio/api/access/roles/{roleId}'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\AccessRoles'
    '@action': 'update'
    '@format': 'json'
  httpMethods: ['PATCH']

-
  name: 'Studio API: delete access role'
  uriPattern: 'neos/studio/api/access/roles/{roleId}'
  defaults:
    '@package': 'Medienreaktor.NeosStudio'
    '@controller': 'Api\AccessRoles'
    '@action': 'delete'
    '@format': 'json'
  httpMethods: ['DELETE']

