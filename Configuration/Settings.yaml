Medienreaktor:
  NeosStudio:
    # Third-party plugin bundles loaded into the Studio shell. Each extending
    # package adds one entry keyed by its package key; the StudioController
    # injects the referenced assets into the served index.html. See
    # Medienreaktor.NeosStudio.ExamplePlugins for a working boilerplate.
    #
    # plugins:
    #   'Vendor.Package':
    #     javascript: 'resource://Vendor.Package/Public/Plugin/plugin.js'   # required, IIFE bundle
    #     stylesheet: 'resource://Vendor.Package/Public/Plugin/plugin.css'  # optional
    #     position: 100                                                     # optional load order
    #
    # Deliberately NOT declared with an empty default here. Flow merges package
    # settings with Arrays::arrayMergeRecursiveOverrule, whose $emptyValuesOverride
    # is true - an empty array declared in this package would replace, not extend,
    # every entry contributed by a package that happens to be merged earlier. The
    # load order depends on the installed package set, so such a default silently
    # drops plugins in some installations and not in others. The controller reads
    # the absent configuration as null and falls back to an empty list.

    # Show a menu next to the logo listing the classic ("legacy") Neos
    # backend modules. The list mirrors the old backend's module menu: built
    # from Neos.Neos.modules, filtered by the backend user's privileges,
    # labels translated into their interface language. Set false to hide it.
    enableLegacyModules: true

    # Celebrate a successful publish with a short confetti burst off the review
    # dialog's publish button. Set false to turn the animation off for the whole
    # installation. Editors who ask their system for reduced motion never see
    # it either way.
    publishCelebration: true

    # The optional realtime sidecar: a Hocuspocus WebSocket server (see "The
    # realtime sidecar" in the README) that carries presence and signals
    # workspace changes with sub-second latency - it watches each workspace's
    # feed head ONCE instead of every editor polling the feed every 2s. Both empty = not
    # configured: collaboration uses plain HTTP polling, which needs no extra
    # infrastructure.
    realtime:
      # WebSocket URL the Studio shell connects to (wss://... in production).
      websocketUrl: ""
      # The sidecar's server-to-server credential: it watches workspace feed
      # heads via /neos/studio/realtime/... with this secret in the X-Realtime-Secret
      # header (REALTIME_SHARED_SECRET on the sidecar). Empty disables the
      # endpoint entirely - it answers 404. Generate a long random value,
      # e.g.: openssl rand -hex 32
      sharedSecret: ""

    previewLinks:
      # Lifetime applied when a client requests none (\DateInterval spec).
      defaultLifetime: "P2D"
      # Hard ceiling - requested lifetimes are clamped to this, so no client
      # (and no misconfigured defaultLifetime) can mint longer-lived links.
      maxLifetime: "P7D"

    # Dynamic access roles: named restriction sets (sites, page tree,
    # dimensions, workspaces, capabilities) that administrators create in the
    # Studio and assign to backend users. See Domain/Model/AccessRole.
    accessControl:
      # Flow roles that access control never applies to. Administrators are
      # the natural default: someone has to be able to fix a role that locked
      # everyone out, and the administration UI itself must stay reachable.
      bypassRoles:
        - "Neos.Neos:Administrator"

      # What a user with NO access role assigned may do. false (the default)
      # means "everything", so installing this package changes nothing until
      # an administrator actually assigns a role - and an editor can never be
      # locked out by simply forgetting them. true turns the absence of a role
      # into a deny-all, for installations that want access to be opt-in.
      restrictUnassignedUsers: false

      # Whether the content repository REFUSES writes outside a user's roles,
      # or the roles only shape the Studio's UI. Enabled means a restriction
      # holds even against a hand-crafted API request; disabled means the
      # roles are a usability feature, not a security boundary. Either way
      # nothing applies to users without a role (see above), so leaving this
      # on is safe to roll out.
      enforceContentRepository: true

    taskWorkflow:
      # Flow role whose members act as reviewers ("super editors") for task
      # workspaces: they get MANAGER on every task workspace and are notified
      # when a task is submitted for review. LivePublisher is the natural
      # default - whoever may publish to live may approve tasks.
      reviewerRole: "Neos.Neos:LivePublisher"

Neos:
  # React to workspace lifecycle events (published -> task DONE +
  # notifications, removed -> sidecar cleanup) via a catch-up hook on the
  # content graph projection.
  ContentRepositoryRegistry:
    presets:
      "default":
        # Narrow the content repository's authorization by the Studio's access
        # roles. The factory wraps Neos' own provider and can only ever add a
        # "no" on top of it (see Security/AccessControlAuthProvider), and users
        # without an assigned role are not restricted at all - so this changes
        # nothing until roles are actually handed out. Set
        # accessControl.enforceContentRepository to false above to keep the
        # roles as a pure UI feature without touching the write path.
        authProvider:
          factoryObjectName: Medienreaktor\NeosStudio\Security\AccessControlAuthProviderFactory

        contentGraphProjection:
          catchUpHooks:
            "Medienreaktor.NeosStudio:TaskWorkspaceLifecycle":
              factoryObjectName: Medienreaktor\NeosStudio\CatchUpHook\TaskWorkspaceLifecycleHookFactory

  Neos:
    fusion:
      autoInclude:
        # Extends Neos.Neos:ContentElementWrapping with the collection marker
        # attribute the Studio guest script styles (see Root.fusion).
        "Medienreaktor.NeosStudio": true

    userInterface:
      translation:
        # Ships the Studio's own UI strings through the same /neos/xliff.json
        # endpoint the classic backend uses; the SPA loads them at boot and
        # resolves them via lib/i18n's translate()/useTranslate helper.
        autoInclude:
          "Medienreaktor.NeosStudio":
            - Main

    moduleConfiguration:
      # Land in the Studio after backend login instead of the classic content
      # module. BackendRedirectionService picks the first entry the user's
      # roles can access, so editors without the Studio privilege still fall
      # back to 'content'.
      preferredStartModules: ["studio", "content", "user/usersettings"]

    modules:
      # Main-level backend menu entry, placed above "Content" (which declares
      # position 'start'). The module controller redirects to the standalone
      # Studio shell at /neos/studio instead of rendering in the module chrome.
      studio:
        position: "before content"
        label: "Neos Studio"
        controller: 'Medienreaktor\NeosStudio\Controller\StudioModuleController'
        description: "API-first editing UI for Neos"
        icon: "fas fa-rocket"
        mainStylesheet: "Lite"

  Fusion:
    defaultContext:
      # Allowed-child-node-type lookup for the collection drop-target markup
      # (see Root.fusion).
      "MedienreaktorStudio": 'Medienreaktor\NeosStudio\Eel\StudioHelper'

  Flow:
    mvc:
      routes:
        "Medienreaktor.NeosStudio":
          position: "before Neos.Neos"

    security:
      authentication:
        providers:
          # Require a logged-in Neos backend user to open the Studio shell.
          # Once loaded, the SPA obtains an OAuth token via the (first-party,
          # auto-approving) authorization flow using the same session.
          # The Studio API (operations of Neos.Api's API under /api, see
          # Neos.OpenApi.FlowAdapter.apis.neos below) is no controller of this
          # package and bearer-token only. ShareController
          # is excluded: the anonymous preview-link endpoint is deliberately
          # sessionless - its token is the sole credential, no backend session
          # must ever get involved. Same for RealtimeController: the sidecar's
          # server-to-server feed-head reads authenticate with a shared secret,
          # never a session.
          "Neos.Neos:Backend":
            requestPatterns:
              "Medienreaktor.NeosStudio:Controllers":
                pattern: "ControllerObjectName"
                patternOptions:
                  controllerObjectNamePattern: 'Medienreaktor\NeosStudio\Controller\(?!ShareController|RealtimeController).*'

  OAuth:
    # The Studio API's scopes are the ApiPrivilege targets of Policy.yaml
    # (studio.*), contributed by Neos.Api's PrivilegeScopes like its own.
    scopeGroups:
      "studio":
        label: "Neos Studio"
        icon: "resource://Medienreaktor.NeosStudio/Public/Icons/Scopes/rocket.svg"
        position: 200

  OpenApi:
    FlowAdapter:
      apis:
        # The Studio API: what the Studio adds to Neos (tasks, notifications,
        # preview links, access roles, creating nodes through their creation
        # dialog), operations of the Neos API itself. Built and
        # secured exactly like Neos.Api's: neos/openapi Api Classes, its
        # ApiAuthContextProvider (scopes = ApiPrivilege targets of Policy.yaml),
        # problem documents - one OpenAPI document, one docs page, and the
        # tools of Neos.Mcp's server.
        neos:
          classes:
            'Medienreaktor\NeosStudio\Endpoint\Access\Access': true
            'Medienreaktor\NeosStudio\Endpoint\Tasks\Tasks': true
            'Medienreaktor\NeosStudio\Endpoint\Notifications\Notifications': true
            'Medienreaktor\NeosStudio\Endpoint\PreviewLinks\PreviewLinks': true
            'Medienreaktor\NeosStudio\Endpoint\AccessRoles\AccessRoles': true
            'Medienreaktor\NeosStudio\Endpoint\CreationDialog\CreationDialog': true
