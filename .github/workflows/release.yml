# Publishes the plugin API's type declarations (Resources/Public/Studio/types)
# to npm as @medienreaktor/neos-studio, at the version the release tag names.
# The tag is the version's only source, as it is for Composer: no file in the
# repository carries one, and this job writes it into the manifest it
# publishes. npm's default dist-tag applies, so every release becomes `latest`.
# Nothing is built here: index.d.ts is committed with the release.
#
# Authenticates through npm trusted publishing (OIDC), configured on npmjs.com
# for this repository and this file name - renaming the file breaks it. There
# is no npm token anywhere. Trusted publishing needs a GitHub-hosted runner.
name: Release

on:
  push:
    tags: [ '*.*.*' ]
  # Publishes a release tagged before this workflow existed, or one whose
  # publish failed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. 2.6.0'
        required: true

# A version can be published only once; two runs of one tag must not race.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm:
    name: Publish plugin types to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token npm exchanges for a publish.
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # Trusted publishing needs npm 11.5.1 or later, which Node 22 does not
      # ship. This only runs npm, so it does not follow the build's .nvmrc.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Only a plain version (2.7.0, 2.7.0-rc.1) is one npm accepts; a tag
      # like v2.7.0 fails here rather than at the registry.
      - name: Set the version from the tag
        working-directory: Resources/Public/Studio/types
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a version like 2.7.0."
            exit 1
          fi
          npm pkg set version="$TAG"

      - name: Publish
        working-directory: Resources/Public/Studio/types
        run: npm publish --access public
